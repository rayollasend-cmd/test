version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: carib-remit-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: carib_remit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carib-remit

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: carib-remit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carib-remit

  # Mailhog (Email Testing)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: carib-remit-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - carib-remit

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carib-remit-backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: carib_remit
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-secret-key-change-in-production
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - carib-remit

  # Frontend Development Server
  frontend:
    image: node:18-alpine
    container_name: carib-remit-frontend
    working_dir: /app
    environment:
      VITE_API_URL: http://localhost:3000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
    networks:
      - carib-remit

volumes:
  postgres_data:
  redis_data:

networks:
  carib-remit:
    driver: bridge

# Usage:
# docker-compose up              # Start all services
# docker-compose down            # Stop all services
# docker-compose logs -f backend # View backend logs
# docker-compose exec postgres psql -U postgres -d carib_remit  # Connect to database
